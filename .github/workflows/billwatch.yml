name: billwatch

on:
  schedule:
    - cron: "0 18 * * 0"      # Sundays 18:00 UTC (~11am Pacific)
  workflow_dispatch:           # manual "Run workflow" button

permissions:
  contents: write              # built-in token: lets the job commit results back

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: pip install pyyaml

      - name: Run bill watch
        env:
          LEGISCAN_API_KEY:  ${{ secrets.LEGISCAN_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional
        run: python billwatch.py

      - name: Commit results
        run: |
          if [[ -n "$(git status --porcelain digests state/seen.json)" ]]; then
            git config user.name  "billwatch-bot"
            git config user.email "billwatch@users.noreply.github.com"
            git add digests state/seen.json
            git commit -m "billwatch $(date -u +%Y-%m-%d)"
            git push
          fi
